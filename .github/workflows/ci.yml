name: Weryfikacja wtyczki Jellyfin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz źródła
        uses: actions/checkout@v4

      - name: Zainstaluj .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Zbuduj, przetestuj i sprawdź paczkę
        shell: pwsh
        run: ./build-plugin.ps1
